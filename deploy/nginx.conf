# llm-hub Nginx 反代 —— SSE 流式必须关闭缓冲，否则 /v1/chat/completions 不逐块输出
upstream llm_hub_app {
    server app:8080;
    keepalive 64;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;
    client_body_timeout 60s;
    send_timeout 600s;

    access_log /var/log/nginx/llm-hub.access.log;
    error_log  /var/log/nginx/llm-hub.error.log warn;

    # 数据面：OpenAI 兼容 /v1/*（含 SSE）
    location /v1/ {
        proxy_pass http://llm_hub_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no always;
        add_header Cache-Control no-cache always;
    }

    # 管理面与静态资源
    location / {
        proxy_pass http://llm_hub_app;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        proxy_pass http://llm_hub_app;
        access_log off;
    }

    location = /metrics {
        proxy_pass http://llm_hub_app;
        allow 127.0.0.0/8;
        deny all;
    }
}
